{% extends "base_page.html" %}

{% block page-title %}
Добавить пример
{% endblock %}

{% block content %}
<div class="container">
    <form method="post" action="{% url 'send_example' %}">
        {% csrf_token %}
        <div class="row">
            <div class="input-field col s12">
                <input id="name" name="name" type="text" class="validate" required>
                <label for="name">Ваше имя</label>
            </div>
        </div>
        <div class="row">
            <div class="input-field col s12">
                <input id="word" name="word" type="text" class="validate" required>
                <label for="word">Слово</label>
            </div>
        </div>
        <div class="row">
            <div class="input-field col s12">
                <textarea id="example_sentence" name="example_sentence" class="materialize-textarea" required></textarea>
                <label for="example_sentence">Пример использования слова</label>
            </div>
        </div>
        <div class="row">
            <div class="input-field col s12">
                <textarea id="translation" name="translation" class="materialize-textarea" required></textarea>
                <label for="translation">Перевод примера</label>
            </div>
        </div>
        <div class="row center-align">
            <button class="btn waves-effect waves-light" type="submit" name="action">Отправить
                <i class="material-icons right">send</i>
            </button>
        </div>
    </form>
    <div class="row center-align">
        <a href="{% url 'index' %}" class="btn waves-effect waves-light">Вернуться на главную</a>
    </div>
</div>
{% endblock %}
